<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>{{{ PRODUCT_NAME }}}</title>
  <!-- Empty icon: stops the browser from requesting /favicon.ico (no 404s, same-origin only). -->
  <link rel="icon" href="data:,">
  <style>
    :root { --orange: #F58324; --purple: #7845D8; --ink: #201338; --white: #FFF6E8; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; overscroll-behavior: none; touch-action: none;
      background: var(--ink); color: var(--white);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    }
    /* Portrait column: fills narrow screens, centred 9:16 on wide ones. */
    #stage {
      position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%);
      width: min(100vw, calc(100dvh * 0.5625)); height: 100dvh;
    }
    #unity-canvas { display: block; width: 100%; height: 100%; background: var(--ink); outline: none; }
    #loading {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
    }
    #loading p { margin: 0; font-size: 16px; letter-spacing: 0.02em; }
    #bar { width: 60%; height: 10px; border-radius: 5px; background: rgba(255, 246, 232, 0.15); overflow: hidden; }
    #bar-fill { width: 0; height: 100%; background: var(--orange); transition: width 0.2s; }
    #rotate {
      position: fixed; inset: 0; display: none; z-index: 10;
      flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      background: var(--ink); text-align: center; padding: 24px;
    }
    #rotate strong { font-size: 22px; color: var(--orange); }
    #rotate span { font-size: 15px; opacity: 0.85; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading"><p>Scrambly Fox Defense</p><div id="bar"><div id="bar-fill"></div></div></div>
  </div>
  <div id="rotate" role="alert"><strong>Rotate your phone</strong><span>This demo plays in portrait.</span></div>

  <script>
    // ---- Page state read by the game (Assets/Plugins/WebGL/PageState.jslib) ----
    // Registered once here: index.html never reloads on in-game restart, so listeners never stack.
    window.scramblyPaused = false;   // page hidden, or phone held in landscape
    window.scramblyResumed = false;  // set on pause -> play; the game skips that frame's delta

    var rotateOverlay = document.getElementById("rotate");
    var coarsePointer = window.matchMedia("(pointer: coarse)");

    function isBlockedLandscape() {
      return coarsePointer.matches && window.innerWidth > window.innerHeight;
    }

    function updatePageState() {
      var landscape = isBlockedLandscape();
      var paused = document.hidden || landscape;
      if (window.scramblyPaused && !paused) window.scramblyResumed = true;
      window.scramblyPaused = paused;
      rotateOverlay.style.display = landscape ? "flex" : "none";
      if (window.scramblySfx) window.scramblySfx.refresh();
    }

    // ---- Sound: synthesized with Web Audio (no audio files, no Unity audio module) ----
    // Brief: starts only after a user interaction, has a mute control, is silent while the page is hidden.
    window.scramblySfx = (function () {
      var ctx = null, master = null, muted = false, lastShot = 0;

      function unlock() {
        if (!ctx) {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          ctx = new AudioCtx();
          master = ctx.createGain();
          master.connect(ctx.destination);
          startMusic();
        }
        refresh();
      }

      // ---- Background music: a soft synthesized loop, scheduled on the audio clock ----
      // C major pentatonic melody over I-vi-IV-V. Scheduling uses ctx.currentTime, which stops while the
      // context is suspended (hidden page, landscape, mute), so the loop pauses and resumes in place.
      var musicBus = null, musicTimer = null, musicStep = 0, musicNext = 0;
      var STEP = 60 / 100 / 2; // eighth notes at 100 BPM, 4-bar loop = 32 steps (~9.6 s)
      var MELODY = [72, 0, 76, 0, 79, 0, 76, 74,   72, 0, 69, 0, 72, 0, 0, 0,
                    69, 0, 72, 0, 77, 0, 76, 74,   74, 0, 79, 0, 74, 0, 0, 0];
      var BASS = [48, 45, 41, 43]; // C, A, F, G: one chord per bar

      function midi(note) { return 440 * Math.pow(2, (note - 69) / 12); }

      function noteAt(freq, t, dur, type, gain, dest) {
        var osc = ctx.createOscillator(), env = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        env.gain.setValueAtTime(0.0001, t);
        env.gain.exponentialRampToValueAtTime(gain, t + 0.02);
        env.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(env); env.connect(dest);
        osc.start(t); osc.stop(t + dur + 0.05);
      }

      function playStep(step, t) {
        var bar = Math.floor(step / 8), beat = step % 8;
        if (beat === 0 || beat === 4) noteAt(midi(BASS[bar] - (beat === 4 ? 0 : 12)), t, STEP * 3.5, "triangle", 0.5, musicBus);
        if (beat % 2 === 0) noteAt(midi(BASS[bar] + 16), t, STEP * 1.6, "sine", 0.12, musicBus); // soft chord pulse
        if (MELODY[step]) noteAt(midi(MELODY[step]), t, STEP * 1.8, "triangle", 0.32, musicBus);
      }

      function startMusic() {
        musicBus = ctx.createGain();
        musicBus.gain.value = 0.22; // under the sound effects
        musicBus.connect(master);
        musicNext = ctx.currentTime + 0.1;
        musicTimer = setInterval(function () {
          // Lookahead scheduler: queue notes up to 150 ms ahead of the audio clock.
          while (musicNext < ctx.currentTime + 0.15) {
            playStep(musicStep, musicNext);
            musicNext += STEP;
            musicStep = (musicStep + 1) % MELODY.length;
          }
        }, 50);
      }

      // Suspend when hidden/landscape or muted; resume otherwise.
      function refresh() {
        if (!ctx) return;
        master.gain.value = muted ? 0 : 0.5;
        if (window.scramblyPaused || muted) { if (ctx.state === "running") ctx.suspend(); }
        else if (ctx.state !== "running") ctx.resume();
      }

      function tone(freq, start, dur, type, gain, slideTo) {
        var t = ctx.currentTime + start;
        var osc = ctx.createOscillator(), env = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
        env.gain.setValueAtTime(0.0001, t);
        env.gain.exponentialRampToValueAtTime(gain, t + 0.012);
        env.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(env); env.connect(master);
        osc.start(t); osc.stop(t + dur + 0.03);
      }

      // Ids match ScramblyFoxDefense.Audio.Sound in C#.
      var sounds = [
        /* 0 Select  */ function () { tone(880, 0, 0.06, "triangle", 0.25); },
        /* 1 Build   */ function () { tone(330, 0, 0.12, "triangle", 0.35, 660); tone(990, 0.08, 0.1, "sine", 0.2); },
        /* 2 Upgrade */ function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, i * 0.06, 0.12, "triangle", 0.28); }); },
        /* 3 Shoot   */ function () { tone(1200, 0, 0.05, "square", 0.05, 600); },
        /* 4 Defeat  */ function () { tone(600, 0, 0.09, "sine", 0.3, 300); tone(1568, 0.05, 0.12, "triangle", 0.18); },
        /* 5 Leak    */ function () { tone(220, 0, 0.25, "sawtooth", 0.12, 110); },
        /* 6 Wave    */ function () { tone(392, 0, 0.14, "triangle", 0.3); tone(587, 0.14, 0.2, "triangle", 0.3); },
        /* 7 Unlock  */ function () { tone(784, 0, 0.1, "sine", 0.3); tone(1175, 0.09, 0.25, "sine", 0.3); },
        /* 8 Coin    */ function () { tone(1319, 0, 0.07, "square", 0.08); tone(1976, 0.05, 0.12, "square", 0.08); },
        /* 9 Cta     */ function () { tone(523, 0, 0.1, "triangle", 0.3); tone(784, 0.08, 0.1, "triangle", 0.3); tone(1047, 0.16, 0.22, "triangle", 0.3); },
        /* 10 Deny   */ function () { tone(180, 0, 0.12, "square", 0.12); tone(150, 0.1, 0.14, "square", 0.12); },
        /* 11 Fanfare*/ function () { [523, 659, 784, 1047, 784, 1047].forEach(function (f, i) { tone(f, i * 0.1, 0.18, "triangle", 0.26); }); }
      ];

      return {
        unlock: unlock,
        refresh: refresh,
        setMuted: function (value) { muted = !!value; refresh(); },
        isMuted: function () { return muted; },
        state: function () { return ctx ? ctx.state : "locked"; }, // for tests: locked / running / suspended
        musicStep: function () { return musicTimer ? musicStep : -1; }, // for tests: advances only while audible
        play: function (id) {
          if (!ctx || muted || window.scramblyPaused || ctx.state !== "running") return;
          if (id === 3) { var now = ctx.currentTime; if (now - lastShot < 0.07) return; lastShot = now; } // cap shot spam
          if (sounds[id]) sounds[id]();
        }
      };
    })();
    // First interaction unlocks audio (browsers block it before a gesture).
    ["pointerdown", "touchend", "keydown"].forEach(function (type) {
      document.addEventListener(type, window.scramblySfx.unlock, { passive: true });
    });

    document.addEventListener("visibilitychange", updatePageState);
    window.addEventListener("resize", updatePageState);
    window.addEventListener("orientationchange", updatePageState);
    window.addEventListener("pagehide", updatePageState);
    window.addEventListener("pageshow", updatePageState);
    updatePageState();

    // ---- No page scroll, zoom or context menu competing with the game ----
    var canvas = document.getElementById("unity-canvas");
    function block(event) { event.preventDefault(); }
    document.addEventListener("touchmove", block, { passive: false });
    document.addEventListener("gesturestart", block);
    canvas.addEventListener("contextmenu", block);

    // ---- Unity loader (local files only, Decompression Fallback build) ----
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      // Cap the render resolution: crisp enough, kinder to phone GPUs.
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };

    var loading = document.getElementById("loading");
    var barFill = document.getElementById("bar-fill");
    var script = document.createElement("script");
    script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        barFill.style.width = Math.round(progress * 100) + "%";
      }).then(function () {
        loading.style.display = "none";
      }).catch(function (message) {
        loading.querySelector("p").textContent = "Could not start the demo.";
        console.error(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
